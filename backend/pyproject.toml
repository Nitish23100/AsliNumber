[project]
name = "aslinumber-backend"
version = "0.1.0"
description = "AsliNumber backend: FastAPI API, worker, and scheduler process roles."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymongo==4.18.2",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "typer==0.27.2",
    "tldextract==5.3.2",
]

[project.optional-dependencies]
# Reserved for later phases (torch/transformers/setfit/spacy per plan §9.1).
# Declared empty in P1 so the extra exists without pulling in unused weight.
ml = []
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.3",
    "ruff==0.16.10",
    # Lightweight in-memory MongoDB fake used by backend/tests/integration
    # repo tests (task 4.2) in place of a real MongoDB instance, which is
    # not assumed to be reachable in every dev/CI environment.
    "mongomock==4.3.0",
    # starlette.testclient (used by every integration test importing
    # fastapi.testclient.TestClient) requires httpx2 to be installed as
    # of the starlette version fastapi==0.142.2 resolves to; it is not a
    # transitive dependency of fastapi's base install (only of its
    # unused "standard" extra), so it must be declared explicitly here.
    # Without this, a clean install (e.g. CI) raises RuntimeError at
    # test-collection time -- it only appeared to work on some local
    # machines where an unrelated package happened to pull in the
    # legacy httpx package, which starlette.testclient still accepts
    # with a deprecation warning.
    "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Ruff lints backend/app (and backend/tests) by default: this file lives in
# backend/, so a bare `ruff check` run from backend/ covers both directories.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Mongo documents (and therefore the Pydantic models mirroring them in
# app/models/) use camelCase field names per the design's Data Models
# section (userId, tenantId, refreshTokenHash, etc.), matching the plan's
# existing collection schema rather than Python's snake_case convention.
[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["N815"]
# FastAPI's dependency-injection idiom is `param: T = Depends(fn)`, which
# Ruff's flake8-bugbear B008 rule otherwise flags as "function call in a
# default argument" -- a real anti-pattern in general, but the documented,
# intentional pattern for this specific framework.
"app/auth/deps.py" = ["B008"]
"app/api/routers/auth.py" = ["B008", "N815"]
# Same FastAPI DI idiom as auth.py, above. N815 is also needed here: P2's
# request bodies mirror the camelCase Mongo field names (displayName,
# officialDomains, contactTypes, etc.), the same convention app/models/
# is already exempted for.
"app/api/routers/brands.py" = ["B008", "N815"]
"app/api/routers/official_contacts.py" = ["B008", "N815"]
"app/api/routers/tenant.py" = ["B008", "N815"]
"app/api/routers/audit.py" = ["B008", "N815"]

# Path is relative to this file's directory (backend/), so this resolves to
# backend/tests, discovering tests under backend/tests/{unit,integration}.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
