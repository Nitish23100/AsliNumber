# AsliNumber local development stack.
# `docker compose up` starts mongo, api, worker, scheduler, and web.
# Defaults (REPLAY_MODE=true, DEMO_MODE=true, PUBLIC_MODE=true) match
# docs/aslinumber-implementation-plan.md section 16.1's local-deployment
# defaults, so a fresh clone reaches a working, seeded login page
# without any live SerpApi key or external service.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./backend
    environment:
      ROLE: api
      MONGO_URI: mongodb://mongo:27017/aslinumber
      REPLAY_MODE: "true"
      DEMO_MODE: "true"
      PUBLIC_MODE: "true"
      LIVE_COLLECTION: "false"
      BIND_HOST: 0.0.0.0
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      FERNET_KEY: ${FERNET_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  worker:
    build:
      context: ./backend
    environment:
      ROLE: worker
      MONGO_URI: mongodb://mongo:27017/aslinumber
      REPLAY_MODE: "true"
      DEMO_MODE: "true"
      PUBLIC_MODE: "true"
    depends_on:
      - mongo

  scheduler:
    build:
      context: ./backend
    environment:
      ROLE: scheduler
      MONGO_URI: mongodb://mongo:27017/aslinumber
      REPLAY_MODE: "true"
      DEMO_MODE: "true"
      PUBLIC_MODE: "true"
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo-data: