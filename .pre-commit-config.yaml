# Pre-commit hooks for AsliNumber.
# Install locally with: pre-commit install
# Run against all files with: pre-commit run --all-files
#
# Requirements: 2.3 (Ruff, Prettier, gitleaks configured), 2.4 (gitleaks blocks
# commits containing known secret patterns).

repos:
  # Ruff: lint + format for the backend (backend/app and backend/tests only).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        args: [--fix]
        files: ^backend/(app|tests)/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/(app|tests)/

  # Prettier: formatting for the frontend source tree.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (frontend)
        files: ^frontend/src/
        additional_dependencies:
          - prettier@3.1.0

  # gitleaks: secret scanning across the whole repository.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
